[workspace]
members = ["nibkit-menu-c", "nib-cheevos"]
# Dependencies resolved to versions that build with each crate's rust-version (1.87).
resolver = "3"

[package]
name = "nibkit"
version = "0.2.1"
edition = "2021"
rust-version = "1.87"
description = "What an app on a nibOS handheld needs to know and do: both screens, vblank, the buttons' names, touch, brightness, volume, where its files go, layered settings"
# MIT, and the fonts in assets/ (embedded by `menu-raster`) under the SIL OFL 1.1.
license = "MIT AND OFL-1.1"
repository = "https://github.com/abradburne/nibkit"
homepage = "https://github.com/abradburne/nibkit"
documentation = "https://docs.rs/nibkit"
readme = "README.md"
keywords = ["handheld", "nibos", "dual-screen", "rg-ds", "sdl2"]
categories = ["game-development", "hardware-support", "os::linux-apis"]
# What goes into the published crate: the code, the fonts `menu-raster` embeds with their
# licence, the examples, and the documents.
include = [
    "src/**/*.rs",
    "build.rs",
    "assets/*.ttf",
    "assets/OFL.txt",
    "assets/README",
    "examples/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
]

# The system the app runs on, chosen when it is built: `nibos` (the default), `stock` (the RG
# DS+'s own OS) or `desktop` (a computer: windows, keyboard, mouse; chosen anyway on any target
# but Linux). `dslot` adds what an emulator or app needs to appear in DSlot.
[features]
default = ["nibos"]
nibos = []
stock = []
desktop = []
dslot = []
# The menu every app shows on the touch screen, as DSlot draws it (no dependencies); with
# `menu-raster`, drawing it into a picture in Roboto Condensed (fontdue).
menu = []
menu-raster = ["menu", "dep:fontdue"]
# Joining Wi-Fi networks (iwd) and pairing Bluetooth devices (BlueZ) over D-Bus: `net::wifi`,
# `net::bluetooth`.
net-control = ["dep:zbus"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
fontdue = { version = "0.9", optional = true }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api", "async-io"] }

[[example]]
name = "radios"
required-features = ["net-control"]

[dev-dependencies]
# For the example only: nibkit itself uses no graphics library.
sdl2 = "0.38"

# docs.rs: everything there is, as it builds on Linux (nibOS).
[package.metadata.docs.rs]
features = ["dslot", "menu-raster", "net-control"]
