[package]
name = "nib-cheevos"
version = "0.2.1"
edition = "2021"
rust-version = "1.87"
description = "RetroAchievements for nibOS's emulators and launcher: rcheevos (vendored, MIT) for the session, the hashes and the service's requests; the launcher's sign-in hand-over; curl as the transport"
# MIT, and rcheevos (rcheevos/LICENSE), MIT too.
license = "MIT"
repository = "https://github.com/abradburne/nibkit"
homepage = "https://github.com/abradburne/nibkit"
documentation = "https://docs.rs/nib-cheevos"
readme = "README.md"
keywords = ["retroachievements", "rcheevos", "emulator", "nibos", "handheld"]
categories = ["emulators", "api-bindings"]
# The vendored rcheevos and the shim go with the crate.
include = ["src/**/*.rs", "csrc", "rcheevos", "libretro", "build.rs", "README.md", "LICENSE-MIT"]
# One copy of rcheevos in a program: two would clash at link time.
links = "nib_rcheevos"

# What a program takes: an emulator the session (`client`, with `hash` for its game); the
# launcher the hashes, zipped games' too, and the service's requests for its shelf (`zip`,
# `api`). `launch`, `ua` and `paths` are always there. rcheevos is built whole either way (it is
# C, compiled once); the features keep out what each side doesn't call, and the zip reader.
[features]
default = ["client", "hash", "zip", "api"]
client = []
hash = []
# Zipped games hashed as the ROM inside (`hash::file` on a .zip).
zip = ["hash", "dep:zip"]
api = []
# CHD disc images hashed (`hash::file` on a .chd, or a playlist whose first disc is one): a CD
# reader for rhash over the `chd` crate (BSD-3-Clause), which decompresses them.
chd = ["hash", "dep:chd"]
# rcheevos' rc_libretro.c (memory maps of libretro cores, the settings and systems it allows
# for a core): needs LIBRETRO_INCLUDE_DIR, the folder with libretro.h (build.rs).
libretro = []

[dependencies]
libc = "0.2"
# A zipped game's ROM, unpacked to be hashed (`zip`): as DSlot reads zips.
zip = { version = "2.4.2", default-features = false, features = ["deflate-miniz"], optional = true }
# A CHD's hunks, decompressed (`chd`).
chd = { version = "0.3", optional = true }

[build-dependencies]
cc = "1"

# FFI into rcheevos through the shim: each unsafe block says why it holds.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "allow"

[package.metadata.docs.rs]
features = ["client", "hash", "zip", "api"]
